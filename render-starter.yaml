# Déploiement Render — PRODUCTION (plan payant + disque persistant)
# À utiliser quand vous passez au plan Starter (~7 $/mois) :
#   New + → Blueprint → choisir ce dépôt → Blueprint Path : render-starter.yaml
# Le disque conserve la base SQLite et les PDF entre les redéploiages.
services:
  - type: web
    name: s2-reussite
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install --no-audit --no-fund && cd client && npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: s2-data
      mountPath: /opt/render/s2-data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # NB : ne PAS définir PORT ici — Render injecte son propre port.
      - key: DATA_DIR
        value: /opt/render/s2-data/data
      - key: UPLOADS_DIR
        value: /opt/render/s2-data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN1_USERNAME
        sync: false
      - key: ADMIN1_PASSWORD
        sync: false
      - key: ADMIN2_USERNAME
        sync: false
      - key: ADMIN2_PASSWORD
        sync: false
