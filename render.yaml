# Déploiement Render — PLAN GRATUIT (sans disque persistant)
# https://render.com/docs/blueprint-spec
#
# ⚠️ Limitation du plan gratuit : le stockage est temporaire. À chaque
# redémarrage/redéploiement, la base repart du seed (comptes admin recréés à
# partir des variables d'environnement, élèves de démo régénérés). Les élèves
# et PDF ajoutés via l'espace admin ne sont PAS conservés.
# → Pour la vraie production : utilisez render-starter.yaml (plan payant + disque).
services:
  - type: web
    name: s2-reussite
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --no-audit --no-fund && cd client && npm install --no-audit --no-fund --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # NB : ne PAS définir PORT ici — Render injecte son propre port et le
      # serveur le lit automatiquement (process.env.PORT).
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN1_USERNAME
        sync: false
      - key: ADMIN1_PASSWORD
        sync: false
      - key: ADMIN2_USERNAME
        sync: false
      - key: ADMIN2_PASSWORD
        sync: false
